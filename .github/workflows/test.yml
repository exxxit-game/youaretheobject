name: test

on:
  # once per commit: every session commit reaches room-polish (the main folder) and is pushed there;
  # a run on the session branch too was a second run of the same commit. The pull request from
  # room-polish into reviewed (kept open for CodeRabbit) shows these runs of its commits: a
  # pull_request trigger would run each commit twice
  push:
    branches: [room-polish, main]

# the tests only read the code: the token cannot write, whatever the repository's default
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the guard prover clones the repository
          persist-credentials: false   # it clones the local checkout, so no step needs the token
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # the guard prover runs only when a guard or its test changed in this push: run on every push it
      # turned the tests red 23 times in a row through its own planting and found one blind guard
      # (the process review of 11.10, the owner's yes); a new branch or a lost "before" runs it
      - id: guards
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            || git diff --name-only "$BEFORE" HEAD | grep -qE '^(tools/(claude-guard|prove-guards|review-gate|secrets|health|health-setup|owner-links|board)\.mjs|tools/hooks/|tests/(guard|structure|review-gate|secrets)\.test\.mjs|\.claude/settings\.json|docs/mistakes\.md)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guards.outputs.changed == 'true'
        run: node tools/prove-guards.mjs --lf   # every guard must go red on its own mistake
      - if: steps.guards.outputs.changed == 'true'
        run: node tools/prove-guards.mjs        # and with Windows line ends, as on the laptop
      - run: npm run test:smoke

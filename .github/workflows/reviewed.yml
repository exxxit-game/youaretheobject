name: reviewed

# The branch `reviewed` is CodeRabbit's baseline: the pull request from room-polish into it shows only
# what CodeRabbit has not read yet. This robot moves it up once CodeRabbit has read a push and none of its
# remarks is open (tools/advance-reviewed.mjs); the session under review never moves it.
# It runs from main, the owner's branch, with main's own copy of the robot: run on a push to room-polish
# with a write token, it ran code the reviewed branch itself could change, so that branch could move its
# own reviewer's baseline (CodeRabbit's remark; the owner's word 11.10). Only triggers whose workflow file
# GitHub takes from the default branch: workflow_run and schedule. This copy on room-polish is inert there
# and is the source the copy on main is made from.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [room-polish]
  # a review or a closed remark brings no event that runs from main: looked at every half hour
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write        # moves the branch reviewed (never main: the ruleset guards it)
  pull-requests: read
  statuses: read

concurrency:
  group: reviewed
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # the robot's own code, never the branch it judges
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/advance-reviewed.mjs
        env:
          GH_TOKEN: ${{ github.token }}
